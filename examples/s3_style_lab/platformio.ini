[platformio]
default_envs = s3
src_dir = main
[env:s3]
platform = espressif32@6.10.0
framework = espidf
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
monitor_speed = 115200
platform_packages = platformio/framework-espidf@3.50400.0
build_flags = -std=gnu++17
# Keep the portable example on C++17.
build_unflags = -std=gnu++2b

[env:s3-no-editor]
extends = env:s3
build_flags = ${env:s3.build_flags} -DLVGL_CBOR_EMBED_EDITOR=0

[env:s3-no-project-api]
extends = env:s3
board_build.cmake_extra_args = -DLVGL_CBOR_PROJECT_API=OFF

[env:s3-no-project]
extends = env:s3
board_build.cmake_extra_args = -DLVGL_CBOR_PROJECT_SERVICE=OFF -DLVGL_CBOR_PROJECT_API=OFF
