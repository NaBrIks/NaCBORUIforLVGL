[platformio]
default_envs = direct-repeat, cbor-repeat, direct-mixed, cbor-mixed
src_dir = main

[env]
platform = espressif32@8.0.0
framework = espidf
extra_scripts = pre:prepare.py
board = esp32-s3-devkitc-1
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.partitions = ../s3_style_lab/partitions.csv
monitor_speed = 115200
platform_packages =
    framework-espidf @ symlink://${platformio.packages_dir}/framework-espidf-v5.5.6
    platformio/toolchain-riscv32-esp@14.2.0+20260121
    platformio/toolchain-xtensa-esp-elf@14.2.0+20260121
build_flags = -std=gnu++17
build_unflags = -std=gnu++2b

[env:board]
board_build.cmake_extra_args = -DBENCH_PROFILE=0

[env:direct-repeat]
board_build.cmake_extra_args = -DBENCH_PROFILE=1

[env:cbor-repeat]
board_build.cmake_extra_args = -DBENCH_PROFILE=2

[env:direct-mixed]
board_build.cmake_extra_args = -DBENCH_PROFILE=3

[env:cbor-mixed]
board_build.cmake_extra_args = -DBENCH_PROFILE=4

[env:pages]
board_build.cmake_extra_args = -DBENCH_PROFILE=5

[env:data]
board_build.cmake_extra_args = -DBENCH_PROFILE=6

[env:schemes]
board_build.cmake_extra_args = -DBENCH_PROFILE=7

[env:history]
board_build.cmake_extra_args = -DBENCH_PROFILE=8

[env:filesystem]
board_build.cmake_extra_args = -DBENCH_PROFILE=9

[env:wifi]
board_build.cmake_extra_args = -DBENCH_PROFILE=10

[env:http]
board_build.cmake_extra_args = -DBENCH_PROFILE=11

[env:editor]
board_build.cmake_extra_args = -DBENCH_PROFILE=12

[env:full]
board_build.cmake_extra_args = -DBENCH_PROFILE=13

[env:format]
board_build.cmake_extra_args = -DBENCH_PROFILE=14

[env:phases-og]
board_build.cmake_extra_args = -DBENCH_PROFILE=2

[env:phases-os]
board_build.cmake_extra_args = -DBENCH_PROFILE=2
